<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Organizer — Changelog</title>
<meta name="description" content="What changed in AI Organizer, build by build.">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #efede5;          /* the app's own warm paper */
    --card: #faf9f5;
    --rule: #e3e0d6;
    --ink: #1c1c1e;
    --muted: #6e6e73;
    --accent: #0a7aff;
    --added: #1f8f4e;
    --improved: #0a7aff;
    --fixed: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --card: #2b2a27;
      --rule: #3a3934;
      --ink: #f2f2f2;
      --muted: #9a9a9e;
      --accent: #4da3ff;
      --added: #4ade80;
      --improved: #4da3ff;
      --fixed: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
  header { margin-bottom: 2.5rem; }
  h1 { font-size: 1.75rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 .35rem; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); }
  article {
    background: var(--card);
    border-radius: 20px;
    padding: 1.25rem 1.375rem 1.375rem;
    margin: 0 0 1rem;
  }
  .meta { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .build {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: .8125rem;
    color: var(--accent);
    background: color-mix(in oklab, var(--accent) 12%, transparent);
    padding: .15rem .55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  time { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
  h2 { font-size: 1.125rem; line-height: 1.3; margin: 0 0 .75rem; letter-spacing: -0.01em; text-wrap: balance; }
  h3 {
    font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    margin: 1rem 0 .35rem; color: var(--muted);
  }
  h3.added { color: var(--added); } h3.improved { color: var(--improved); } h3.fixed { color: var(--fixed); }
  ul { margin: 0; padding-left: 1.2rem; }
  li { margin: .3rem 0; text-wrap: pretty; }
  li + li { border-top: 0; }
  .empty, .error { color: var(--muted); padding: 2rem 0; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .8125rem; }
  a { color: var(--accent); text-underline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI Organizer — Changelog</h1>
    <p>What changed, build by build. Newest first.</p>
  </header>
  <section id="entries" aria-live="polite"><p class="empty">Loading…</p></section>
  <footer>Times are India Standard Time.</footer>
</main>
<script>
(async () => {
  const el = document.getElementById('entries');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pretty = (date, time) => {
    const [y, m, d] = date.split('-').map(Number);
    return `${d} ${months[m - 1]} ${y} · ${time}`;
  };
  const list = (label, cls, items) => (items && items.length)
    ? `<h3 class="${cls}">${label}</h3><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : '';
  try {
    const res = await fetch('changelog.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const entries = await res.json();
    if (!entries.length) { el.innerHTML = '<p class="empty">Nothing yet.</p>'; return; }
    el.innerHTML = entries.map(e => `
      <article>
        <div class="meta">
          <span class="build">${esc(e.version)} (${esc(e.build)})</span>
          <time datetime="${esc(e.date)}T${esc(e.time)}:00+05:30">${pretty(e.date, e.time)} ${esc(e.timezone || 'IST')}</time>
        </div>
        <h2>${esc(e.title)}</h2>
        ${list('Added', 'added', e.added)}
        ${list('Improved', 'improved', e.improved)}
        ${list('Fixed', 'fixed', e.fixed)}
      </article>`).join('');
  } catch (err) {
    el.innerHTML = '<p class="error">Couldn’t load the changelog.</p>';
  }
})();
</script>
</body>
</html>
